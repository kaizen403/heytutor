<text x="20" y="28" font-size="16" fill="#222">In R^2, graph (3/2)(x - 2y) &lt; -x + 5. Label the boundary with an equivalent integer-coefficient equation and l</text>
<text x="20" y="48" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#666">family=linear_half_plane tier=qualitative_verified labels=x | y | 0 | (3/2)(x - 2y)=-x + 5 | A | B | C | D | (3/2)(x - 2y)&lt;-x + 5 | A=(0, 0) included | B=(2, 0) excluded | C=(-1, -3) excluded | D=(2, 1) included | Shaded side satisfies the inequality</text>
