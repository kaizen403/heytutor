<rect x="410" y="55" width="740" height="555" fill="none" stroke="#ECE9D8"/>
<text x="20" y="28" font-size="16" fill="#222">For every real pair (x,y), graph 5 - 3x &lt;= 2x - 10. Draw the solution half-plane, label its boundary, and mark</text>
<text x="20" y="48" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#666">family=linear_half_plane tier=qualitative_verified labels=x | y | 0 | 5 - 3x=2x - 10 | A | B | C | 5 - 3x&lt;=2x - 10 | A=(3, -2) included | B=(2, 4) excluded | C=(5, -1) included | Shaded side satisfies the inequality</text>
<polygon points="801.13,586 938.44,586 938.44,205.75 801.13,205.75" fill="rgba(31,111,139,.12)" stroke="none" stroke-width="1.15" stroke-linejoin="round"/>
<line x1="621.56" y1="438.13" x2="938.44" y2="438.13" fill="none" stroke="#141821" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowhead)"/><line x1="674.38" y1="586" x2="674.38" y2="205.75" fill="none" stroke="#141821" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowhead)"/>
