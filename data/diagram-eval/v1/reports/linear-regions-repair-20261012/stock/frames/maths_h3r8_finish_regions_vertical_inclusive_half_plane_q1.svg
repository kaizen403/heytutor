<text x="814.13" y="386.88" font-size="18" dominant-baseline="hanging" textLength="78.38926171061375" lengthAdjust="spacingAndGlyphs" fill="#B93A2C">5 - 3x=2x - 10</text>
<circle cx="801.13" cy="522.63" r="4" fill="#141821"/>
