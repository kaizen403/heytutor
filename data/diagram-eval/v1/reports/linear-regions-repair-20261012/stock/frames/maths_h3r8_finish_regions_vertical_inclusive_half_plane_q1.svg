<text x="737.9381104155592" y="171.4" font-size="18" dominant-baseline="hanging" textLength="84.12377916888154" lengthAdjust="spacingAndGlyphs" fill="#B93A2C">5 - 3x&lt;=2x - 10</text>
<text x="732.9389101429849" y="146.05" font-size="18" dominant-baseline="hanging" textLength="94.12217971403011" lengthAdjust="spacingAndGlyphs" fill="#B93A2C">A=(3, -2) included</text>
<text x="734.0205525447662" y="120.69999999999999" font-size="18" dominant-baseline="hanging" textLength="91.9588949104675" lengthAdjust="spacingAndGlyphs" fill="#B93A2C">B=(2, 4) excluded</text>
