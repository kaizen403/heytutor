<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--seo-head-->
    <title>Accelute | AI Whiteboard Tutor for Every Subject</title>
    <meta
      name="description"
      content="Ask a question or upload a photo. Accelute teaches maths, physics, chemistry and coding with voice, a live whiteboard, lesson replay and downloadable notes."
    />
    <link rel="canonical" href="https://accelute.co/" />
    <meta property="og:url" content="https://accelute.co/" />
    <meta property="og:title" content="Accelute | AI Whiteboard Tutor for Every Subject" />
    <meta
      property="og:description"
      content="Ask a question or upload a photo. Accelute teaches maths, physics, chemistry and coding with voice, a live whiteboard, lesson replay and downloadable notes."
    />
    <meta name="twitter:title" content="Accelute | AI Whiteboard Tutor for Every Subject" />
    <meta
      name="twitter:description"
      content="Ask a question or upload a photo. Accelute teaches maths, physics, chemistry and coding with voice, a live whiteboard, lesson replay and downloadable notes."
    />
    <script type="application/ld+json" id="seo-jsonld">
      {"@context":"https://schema.org","@graph":[]}
    </script>
    <!--/seo-head-->

    <meta name="application-name" content="Accelute" />
    <meta name="author" content="Accelute" />
    <meta name="theme-color" content="#06121C" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <!-- SVG first so Chromium picks the crisp homepage mark, not the ICO.
         PNGs cover browsers that ignore SVG. ?v=3 busts a sticky cached tab icon. -->
    <link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml" sizes="any" />
    <link rel="icon" href="/favicon-32x32.png?v=3" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-16x16.png?v=3" type="image/png" sizes="16x16" />
    <link rel="shortcut icon" href="/favicon.ico?v=3" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="alternate" type="text/plain" title="LLM" href="https://accelute.co/llms.txt" />

    <!-- The faces the first screen sets: headline, body, and button labels.
         The lesson voice is not preloaded; it plays only after a tap, and the
         lesson window fetches it once the section comes into reach. -->
    <link rel="preload" href="/fonts/stack-sans-notch.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/dm-mono-500.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Caveat only appears below the fold, so its stylesheet must not block
         the first paint. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      id="caveat-fonts"
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&display=swap"
      rel="stylesheet"
      media="print"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&display=swap" rel="stylesheet" />
    </noscript>

  </head>
  <body style="background:#06121C">
    <!--seo-noscript-->
    <noscript></noscript>
    <!--/seo-noscript-->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
