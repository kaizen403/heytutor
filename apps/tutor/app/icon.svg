  <rect x="2" y="2" width="252" height="252" rx="42" fill="none" stroke="#7FC4E2" stroke-width="4"/>
  <g transform="translate(128 128) scale(0.72) translate(-128 -128)" fill="#F0F5F7">
    <path d="M144 256 28 256 144 140ZM256 200 200 256V56H0l56-56h200v200ZM0 204V112h92z"/>
  </g>
</svg>
