packages:
  - "apps/*"
  - "packages/*"
onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - "esbuild"
  - "prisma"
overrides:
  # Prisma 6 uses only plain-record deepmerge in its local config loader.
  # v8 preserves that API and fixes recursive-graph stack exhaustion.
  "@prisma/config@6>deepmerge-ts": "8.0.2"
  "baseline-browser-mapping@2": "2.11.0"
  # Compatible security releases for transitive tooling/runtime dependencies.
  "brace-expansion@1": "1.1.21"
  "brace-expansion@5": "5.0.12"
  "browserslist@4": "4.28.7"
  "decode-uri-component@0": "0.5.1"
  dompurify: "3.4.17"
  "glob@13": "14.0.3"
  "js-yaml@4": "4.3.2"
  "minimatch@10": "11.0.4"
  # GHSA-g3hv-75wg-m249 and GHSA-3g3m-2fjr-6pw4. minimatch 3 has no patched
  # release; its only users are ESLint and its plugins, and the patch below keeps
  # the callable export they require.
  "minimatch@3": "11.0.4"
  "nanoid@3": "3.3.18"
  postcss: "8.5.26"
  "postcss-selector-parser@6": "7.1.6"
  sharp: "0.35.5"
  source-map-js: "1.2.2"
  # tsup 8's build API remains compatible; v0.28.1 fixes Windows serve paths.
  "tsup@8>esbuild": "0.28.1"
  "zod@4": "4.6.6"
patchedDependencies:
  braces@3.0.3: patches/braces@3.0.3.patch
  minimatch@11.0.4: patches/minimatch@11.0.4.patch
