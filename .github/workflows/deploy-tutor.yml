name: Deploy

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('security-pr-{0}', github.event.pull_request.number) || 'deploy' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PNPM_VERSION: "10.32.0"
  WRANGLER_VERSION: "4.146.0"
  CLOUDFLARE_PAGES_PROJECT: accelute
  VITE_TUTOR_ORIGIN: https://app.accelute.co

jobs:
  security:
    name: Security checks
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        # Docker Official Image via Google's Docker Hub mirror; same pinned manifest as
        # docker.io/library/postgres:17. public.ecr.aws hit "toomanyrequests: Data limit
        # exceeded" on shared runners; Docker Hub has pull quotas. Pin reviewed bytes.
        image: mirror.gcr.io/library/postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_USER: security
          POSTGRES_PASSWORD: security_ci_only
          POSTGRES_DB: heytutor_security_ci
        ports:
          - "127.0.0.1:5432:5432"
        options: >-
          --health-cmd "pg_isready -U security -d heytutor_security_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://security:security_ci_only@127.0.0.1:5432/heytutor_security_ci
      SECURITY_TEST_DATABASE_URL: postgresql://security:security_ci_only@127.0.0.1:5432/heytutor_security_ci
      PGHOST: 127.0.0.1
      PGUSER: security
      PGPASSWORD: security_ci_only
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2
      - name: Fetch main for cache-order comparison
        run: git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install audio validation and database tools
        # On 26 Oct 2026 the Azure Ubuntu mirror served ffmpeg's 66 MB of dependencies at
        # 30 to 40 kB/s and this step ate the whole 35 minute job. apt's own timeouts do not
        # catch a slow but live transfer, so each download attempt is bounded by `timeout`,
        # and later attempts drop the Azure mirror so apt uses the next mirrors in the
        # runner's list. Finished downloads stay in the apt cache between attempts. The step
        # still fails loudly when the tools cannot be installed.
        timeout-minutes: 10
        run: |
          set -euo pipefail
          apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
          packages=(ffmpeg postgresql-client)
          mirrors=/etc/apt/apt-mirrors.txt
          azure='azure\.archive\.ubuntu\.com'
          downloaded=false
          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ] && [ -f "$mirrors" ] \
              && grep -q "$azure" "$mirrors" \
              && grep -vE "${azure}|^[[:space:]]*$" "$mirrors" >/dev/null; then
              echo "Attempt $attempt: dropping the Azure Ubuntu mirror"
              sudo sed -i "/${azure}/d" "$mirrors"
            fi
            if sudo timeout --kill-after=10s 45s apt-get "${apt_opts[@]}" update \
              && sudo timeout --kill-after=10s 120s apt-get "${apt_opts[@]}" install -y \
                --no-install-recommends --download-only "${packages[@]}"; then
              downloaded=true
              break
            fi
            echo "::warning::apt download attempt $attempt failed or timed out"
          done
          if [ "$downloaded" != true ]; then
            echo "::error::Could not download ${packages[*]} in 3 bounded attempts"
            exit 1
          fi
          sudo apt-get "${apt_opts[@]}" install -y --no-install-recommends "${packages[@]}"
          for tool in ffmpeg ffprobe psql; do
            command -v "$tool" >/dev/null || { echo "::error::$tool is missing after install"; exit 1; }
          done
          ffmpeg -version >/dev/null
          ffprobe -version >/dev/null
      - name: Install dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run reviewed native build scripts and generate Prisma
        run: |
          pnpm rebuild @prisma/client @prisma/engines esbuild prisma
          pnpm --filter @heytutor/tutor exec prisma generate
      - name: Verify gate list preservation and execution
        run: node --test tools/verify/run-gates.test.mjs
      - name: Build shared packages
        run: pnpm turbo run build --filter='./packages/*'
      - name: Yield switch and PR246 review blocker regressions (offline)
        run: |
          pnpm --filter @heytutor/scene-engine exec tsx scripts/verify/verify-yield-switch-blockers.ts
          pnpm --filter @heytutor/scene-engine exec tsx scripts/verify/verify-pr246-review-blockers.ts
          pnpm --filter @heytutor/scene-engine exec tsx scripts/verify/verify-repair-measured-precision.ts
          pnpm --filter @heytutor/scene-engine exec tsx scripts/verify/verify-yield-legibility.ts
      - name: Symbolic planner regressions
        run: |
          pnpm --filter @heytutor/scene-engine verify:symbolic-planner
          pnpm --filter @heytutor/tutor-core verify:symbolic-planner
      - name: Handwriting and speech notation regressions
        run: |
          pnpm --filter @heytutor/drawing verify
          pnpm --filter @heytutor/whiteboard verify
          pnpm --filter @heytutor/tutor-core exec tsx scripts/verify/verify-speech-notation.ts
      - name: Preserve the development webpack cache
        run: pnpm --filter @heytutor/tutor verify:dev-cache
      - name: Typecheck and lint
        run: |
          pnpm typecheck
          pnpm lint
      - name: Build production applications
        run: pnpm build
      - name: Failed-turn Sentry privacy and reporting regressions (no external calls)
        run: |
          pnpm --filter @heytutor/tutor verify:sentry
          pnpm --filter @heytutor/tutor exec tsx scripts/verify/verify-sentry-runtime.ts
          pnpm --filter @heytutor/tutor exec tsx scripts/verify/verify-sentry-log-privacy.ts
          pnpm --filter @heytutor/tutor exec tsx scripts/verify/verify-tts-relay-cancellation.ts
          pnpm --filter @heytutor/tutor exec tsx scripts/verify/verify-worker-failure-log.ts
          pnpm --filter @heytutor/tutor exec tsx scripts/verify/verify-billing-failure-telemetry.ts
          pnpm --filter @heytutor/tutor exec node --experimental-test-module-mocks --import tsx scripts/verify/verify-teaching-reservation-budget.ts
          pnpm --filter @heytutor/tutor exec tsx scripts/verify/verify-home-suggestion-race.ts
          node deploy/aws/verify-sentry-release.mjs
      - name: Diagram authority and restoration regressions
        run: pnpm --filter @heytutor/tutor verify:publication
      - name: VSEPR source evidence and save regressions (offline)
        run: pnpm --filter @heytutor/tutor exec tsx --tsconfig tsconfig.json scripts/verify/verify-vsepr-source-evidence.ts
      - name: ProblemIR body binding repros and river and launch height declines (offline)
        run: pnpm --filter @heytutor/tutor exec tsx scripts/verify/verify-obligation-binding-repros.ts
      - name: Atomic scene label regressions
        run: pnpm --filter @heytutor/tutor verify:atomic-labels
      - name: Figure tour narration regressions
        run: pnpm --filter @heytutor/tutor verify:primitive-tour
      - name: Text-only lesson narration and board regressions (offline)
        run: |
          pnpm --filter @heytutor/tutor exec tsx scripts/verify/verify-text-only-narration.ts
          pnpm --filter @heytutor/tutor exec tsx scripts/verify/verify-text-only-board.ts
      - name: DSA verified intro ordering regressions
        run: pnpm --filter @heytutor/tutor verify:dsa-intro-order
      - name: Source-grounded board title regressions
        run: pnpm --filter @heytutor/tutor exec tsx scripts/verify/verify-board-title.ts
      - name: Storage admission and save feedback regressions
        run: pnpm --filter @heytutor/tutor verify:storage-admission
      - name: Finished playback and MP4 board fidelity regressions
        run: pnpm --filter @heytutor/tutor verify:board-playback-export
      - name: Teaching network, completion and speech ownership (no external calls)
        run: |
          pnpm --filter @heytutor/tutor-core exec tsx scripts/verify/verify-teaching-network-recovery.ts
          pnpm --filter @heytutor/tutor exec tsx scripts/verify/verify-teaching-completion-integrity.ts
          pnpm --filter @heytutor/tutor exec tsx scripts/verify/verify-teaching-failure-classification.ts
          pnpm --filter @heytutor/tutor exec tsx scripts/verify/verify-continuation-fetch-retry.ts
          pnpm --filter @heytutor/tutor exec tsx scripts/verify/verify-segment-speech-ownership.ts
          pnpm --filter @heytutor/tutor exec tsx scripts/verify/verify-stale-tab-reload.ts
          pnpm --filter @heytutor/tutor exec tsx scripts/verify/verify-graceful-shutdown.ts
      - name: Teaching truth and scoped solver authority (no model calls)
        run: |
          pnpm --filter @heytutor/tutor exec tsx scripts/verify/verify-teaching-truth-authority.ts
          pnpm --filter @heytutor/tutor-core exec tsx scripts/verify/verify-code-teaching-truth.ts
          pnpm --filter @heytutor/tutor exec tsx scripts/verify/verify-programming-example-integrity.ts
          pnpm --filter @heytutor/tutor exec tsx scripts/verify/verify-teaching-statement-truth.ts
      - name: Recorded lesson scheduling and persistence (no external calls)
        run: pnpm --filter @heytutor/tutor exec tsx scripts/verify/verify-recorded-lesson-integrity.ts
      - name: Kimi board and voice sync regressions (no model calls)
        run: |
          pnpm --filter @heytutor/tutor exec tsx scripts/verify/verify-row-focus-sync.ts
          pnpm --filter @heytutor/tutor-core exec tsx scripts/verify/verify-kimi-lesson-pacing.ts
          pnpm --filter @heytutor/tutor exec tsx scripts/verify/verify-kimi-code-obligations.ts
      - name: Lesson admission, voice recovery, work pages and programming sync regressions
        run: |
          pnpm --filter @heytutor/tutor-core exec tsx scripts/verify/verify-tts-native-startup.ts
          pnpm --filter @heytutor/tutor-core exec tsx scripts/verify/verify-tts-pause-resume.ts
          pnpm --filter @heytutor/tutor-core exec tsx scripts/verify/verify-tts-paused-arrival.ts
          pnpm --filter @heytutor/tutor exec tsx scripts/verify/verify-live-speech-pause.ts
          pnpm --filter @heytutor/tutor exec tsx scripts/verify/verify-voice-stall-teaching.ts
          pnpm --filter @heytutor/tutor-core exec tsx scripts/verify/verify-tts-abandon-keeps-lookahead.ts
          pnpm --filter @heytutor/tutor verify:lesson-qa-2
          pnpm --filter @heytutor/tutor verify:lesson-qa-3
          pnpm --filter @heytutor/tutor exec tsx scripts/verify/verify-two-sum-grounding.ts
          pnpm --filter @heytutor/tutor verify:youtube-lesson-qa
          pnpm --filter @heytutor/tutor exec tsx scripts/verify/verify-export-cache-workflow.ts
          pnpm --filter @heytutor/tutor exec tsx scripts/verify/verify-export-render-fingerprint.ts
      - name: Answer reveal and teaching conditions (no model calls)
        run: |
          pnpm --filter @heytutor/tutor exec tsx scripts/verify/verify-label-accuracy.ts
          pnpm --filter @heytutor/tutor exec tsx scripts/verify/verify-doubt-same-board.ts
          pnpm --filter @heytutor/tutor verify:answer-label-completion
          pnpm --filter @heytutor/tutor exec tsx scripts/verify/verify-given-dimension-ownership.ts
          pnpm --filter @heytutor/tutor verify:conductance-teaching
          pnpm --filter @heytutor/tutor verify:figure-sentence-boundary
          pnpm --filter @heytutor/tutor exec tsx scripts/verify/verify-answer-export-cache.ts
      - name: Phone readability and explanation pointing (no model calls)
        run: |
          pnpm --filter @heytutor/tutor verify:phone-board-readability
          pnpm --filter @heytutor/tutor verify:explanation-pointing
      - name: Installed rendering dependency metadata regressions (bounded fixtures)
        run: node --test apps/tutor/scripts/verify/verify-installed-render-fingerprint.mjs apps/tutor/scripts/verify/verify-installed-render-fingerprint-contract.mjs
      - name: Live diagram picker regressions (no model calls)
        run: |
          pnpm --filter @heytutor/tutor exec tsx scripts/verify/verify-live-diagram-picker.ts
          pnpm --filter @heytutor/tutor exec tsx scripts/verify/verify-diagram-eval.ts
      - name: Security and payment regressions
        run: |
          python3 deploy/aws/verify-ssm-deploy.py
          pnpm verify:security
          pnpm --filter @heytutor/tutor verify:razorpay
      - name: Disposable database concurrency checks
        run: |
          # Real empty migration deployment, including immutable legacy SQL.
          createdb heytutor_migrations_verify_ci
          export MIGRATION_TEST_DATABASE_URL=postgresql://security:security_ci_only@127.0.0.1:5432/heytutor_migrations_verify_ci
          pnpm --filter @heytutor/tutor verify:fresh-migrations
          pnpm --filter @heytutor/tutor exec prisma validate
          pnpm --filter @heytutor/tutor db:migrate:deploy
          pnpm verify:security-db
          createdb heytutor_razorpay_verify_ci
          export DATABASE_URL=postgresql://security:security_ci_only@127.0.0.1:5432/heytutor_razorpay_verify_ci
          pnpm --filter @heytutor/tutor db:migrate:deploy
          pnpm --filter @heytutor/tutor verify:razorpay-db
      - name: Reject known dependency vulnerabilities
        run: pnpm verify:dependency-security

  deploy-dev:
    name: Cloudflare Pages (dev)
    needs: security
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: dev
      url: https://dev.accelute.pages.dev
    steps:
      - name: Require Cloudflare credentials
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          if [ -z "$TOKEN" ]; then echo "CLOUDFLARE_API_TOKEN is not set"; missing=1; fi
          if [ -z "$ACCOUNT" ]; then echo "CLOUDFLARE_ACCOUNT_ID repo variable is not set"; missing=1; fi
          if [ "$missing" -ne 0 ]; then
            echo "Set the CLOUDFLARE_API_TOKEN secret (Account / Cloudflare Pages / Edit) and the CLOUDFLARE_ACCOUNT_ID variable, then re-run."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm rebuild @prisma/client @prisma/engines esbuild prisma
          pnpm --filter @heytutor/tutor exec prisma generate

      - name: Build landing
        run: pnpm turbo run build --filter=@heytutor/landing...
        env:
          VITE_TUTOR_ORIGIN: ${{ env.VITE_TUTOR_ORIGIN }}

      - name: Upload landing dist
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: landing-dist
          path: apps/landing/dist
          retention-days: 1

      - name: Deploy landing to Cloudflare Pages (dev)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          npx --yes wrangler@${{ env.WRANGLER_VERSION }} pages deploy apps/landing/dist
          --project-name=accelute
          --branch=dev
          --commit-dirty=true
          --commit-hash=${{ github.sha }}

  sync-branches:
    name: Keep dev and main in sync
    needs: deploy-dev
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Point both long-lived branches at this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            if git merge-base --is-ancestor origin/dev "$GITHUB_SHA"; then
              git push origin "${GITHUB_SHA}:refs/heads/dev"
            else
              echo "dev contains independent commits; preserving its branch head."
            fi
          else
            if ! git merge-base --is-ancestor origin/main "$GITHUB_SHA"; then
              echo "main has advanced; reconcile dev through a reviewed PR before promotion."
              exit 1
            fi
            git push origin "${GITHUB_SHA}:refs/heads/main"
          fi

  deploy-production:
    name: Production (Cloudflare + tutor)
    needs: [deploy-dev, sync-branches]
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      id-token: write
    environment:
      name: production
      url: https://app.accelute.co
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Download landing dist
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: landing-dist
          path: apps/landing/dist

      - name: Deploy landing to Cloudflare Pages (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          npx --yes wrangler@${{ env.WRANGLER_VERSION }} pages deploy apps/landing/dist
          --project-name=accelute
          --branch=main
          --commit-dirty=true
          --commit-hash=${{ github.sha }}

      - name: Require restricted AWS deployment configuration
        env:
          DEPLOY_ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          INSTANCE_ID: ${{ vars.AWS_TUTOR_INSTANCE_ID }}
        run: |
          set -euo pipefail
          if [[ ! "$DEPLOY_ROLE" =~ ^arn:aws:iam::[0-9]{12}:role/.+$ ]] || [[ ! "$INSTANCE_ID" =~ ^i-[0-9a-f]{8,17}$ ]]; then
            echo "Set production variables AWS_DEPLOY_ROLE_ARN and AWS_TUTOR_INSTANCE_ID for the restricted AcceluteDeploy SSM document."
            exit 1
          fi

      - name: Assume production deployment role using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-2
          role-session-name: accelute-deploy-${{ github.run_id }}
          role-duration-seconds: 3600
          mask-aws-account-id: true

      - name: Deploy tutor through the restricted SSM document
        env:
          INSTANCE_ID: ${{ vars.AWS_TUTOR_INSTANCE_ID }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          command_id=$(aws ssm send-command \
            --document-name AcceluteDeploy \
            --instance-ids "$INSTANCE_ID" \
            --parameters "{\"Commit\":[\"${GITHUB_SHA}\"]}" \
            --timeout-seconds 2400 \
            --query Command.CommandId --output text)
          echo "SSM deployment command: $command_id"
          # The document also limits execution to 40 minutes. Do not print its
          # production process output or environment into public Actions logs.
          for attempt in $(seq 1 250); do
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || true)
            case "$status" in
              Success) echo "Tutor deploy and health check succeeded"; exit 0 ;;
              Failed|Cancelled|TimedOut|Cancelling)
                echo "Tutor deployment ended with SSM status: $status"
                exit 1 ;;
            esac
            sleep 10
          done
          echo "Tutor deployment did not complete within the bounded SSM wait; inspect the command in AWS Systems Manager."
          exit 1
