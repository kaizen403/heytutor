name: Deploy tutor

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-tutor
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Require deploy secrets
        env:
          HOST: ${{ secrets.TUTOR_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.TUTOR_DEPLOY_USER }}
          KEY: ${{ secrets.TUTOR_DEPLOY_SSH_KEY }}
        run: |
          missing=0
          if [ -z "$HOST" ]; then echo "TUTOR_DEPLOY_HOST is not set"; missing=1; fi
          if [ -z "$DEPLOY_USER" ]; then echo "TUTOR_DEPLOY_USER is not set"; missing=1; fi
          if [ -z "$KEY" ]; then echo "TUTOR_DEPLOY_SSH_KEY is not set"; missing=1; fi
          if [ "$missing" -ne 0 ]; then
            echo "Set the three TUTOR_DEPLOY_* repo secrets, then re-run."
            exit 1
          fi

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.TUTOR_DEPLOY_HOST }}
          username: ${{ secrets.TUTOR_DEPLOY_USER }}
          key: ${{ secrets.TUTOR_DEPLOY_SSH_KEY }}
          command_timeout: 40m
          request_pty: true
          script: |
            set -euo pipefail
            cd /opt/heytutor
            git fetch origin main
            git reset --hard origin/main
            ./deploy/aws/deploy.sh
